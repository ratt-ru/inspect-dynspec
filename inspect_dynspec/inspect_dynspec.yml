cabs:
  inspect_dynspec:
    info: Inspection tool for dynamic spectra produced by ms2dynspec.
    backend:
      select: native
    command: inspect-dynspec
    policies:
      prefix: "--"
    inputs:
      root:
        info: "Path to root folder of ms2dynspec output"
        dtype: Directory
        required: true
        policies:
          positional: true
      kernel:
        info: "Smoothing kernel FWHM size as tuples: (nu_delta (MHz), t_delta (s)) i.e. stimela run inspect_dynspec.yml kernel=[[2,3],[3,:]]. Where one aspect of the kernel is left blank, it is calculated so as to provide a circular kernel in index space. If both aspects are left blank, defaults to (1,1) in index space."
        dtype: List[Tuple[str,str]]
        default: [1,1]
        policies:
          repeat: repeat
          format: ({0[0]},{0[1]})
      nu-bounds:
        dtype: List[int]
        info: "Frequency range to consider in index units. Default: 0 -1"
        default : [0,-1]
        policies:
          repeat: '[]'
      t-bounds:
        dtype: List[int]
        info: "Time range to consider in index units. Default: 0 -1"
        default : [0,-1]
        policies:
          repeat: '[]'
      n-threads:
        dtype: int
        info: "Number of threads to use for FFT operations. Default 32."
        default: 32
      stokes:
        dtype: str
        info: "Stokes parameter to consider. Provide string with any of I, Q, U, V. Eg: IV"
        default: "IQUV"
      std-scale:
        dtype: float 
        info: "Plot saturates at std_scale * std(data) in plots"
        default: 4.0
      debug:
        dtype: bool
        info: "Produce a plot of all terms for debugging purposes"
        default: false
      plot-for-paper:
        dtype: bool
        info: "Plot the data in a format suitable for publication"
        default: false
      zero-vcenter:
        dtype: bool
        info: "Set vcenter to zero instead of the mean of the data"
        default: false
      dpi:
        dtype: int
        info: "DPI of the output plots. Default 300."
        default: 300
      calc-circular-pol:
        dtype: bool
        info: "Calculate circular polarisation fraction V/I before smoothing."
        default: false
      calc-linear-pol:
        dtype: bool
        info: "Calculate linear polarisation fraction sqrt((Q^2 + U^2) / I^2) before smoothing."
        default: false
      calc-pol-power:
        dtype: bool
        info: "Calculate polarisation power (Q^2 + U^2 + V^2) before smoothing."
        default: false
      calc-rm-synth:
        info: "Calculate RM synthesis with phi params: [phi_min, phi_max, n_phi]. E.g. calc-rm-synth=[-100,100,256]"
        dtype: List[int]
        policies:
          repeat: '[]'
      calc_sec_spec:
        dtype: bool
        info: "Calculate the secondary spectrum (2D power spectrum over delay and Doppler frequency) of the unsmoothed, whitened data for each requested Stokes parameter."
        default: false
      sec_spec_smooth:
        dtype: int
        info: "Boxcar width in pixels applied to the power (reduces speckle). 1 = off"
        default: 3
      sec_spec_pad:
        dtype: int
        info: "Padding factor for the secondary spectrum. Default is 2."
        default: 2
      sec_spec_fd_max:
        dtype: Optional[float]
        info: "Maximum Doppler frequency |f_D| shown in the secondary spectrum plot, in mHz. Default: the whole axis (or the auto zoom)."
      sec_spec_tau_max:
        dtype: Optional[float]
        info: "Maximum delay shown in the secondary spectrum plot, in microseconds. Default: the whole axis (or the auto zoom)."
      sec-spec-zoom:
        dtype: str
        info: "Region of the secondary spectrum to plot: 'none' (default) shows the whole plane, 'auto' frames the region of significant power around the origin (scintles and any arc). sec_spec_fd_max / sec_spec_tau_max, when given, override that axis."
        default: "none"
      sec-spec-zoom-margin:
        dtype: float
        info: "With sec-spec-zoom auto, show this many times the extent of the significant region (1 = just that region). Default 2."
        default: 2.0
      zero-sub-value-tolerance:
        dtype: float
        info: "Circular and linear polarization fractions require division by I. To avoid divide by zero issues, values within 0 ± tolerance are substituted for this tolerance value."
        default: 1e-4
      cmap:
        dtype: str
        info: "Colormap to use for plotting. Default is RdYlBu_r."
        default: "RdYlBu_r"
      verbose:
        dtype: bool
        info: "Enable verbose console output"
        default: false
      use-gpr:
        dtype: bool
        info: "Use Gaussian Process Regression (GPR) smoothing instead of standard convolution. If not specified, defaults to False and all gpr parameters are ignored."
        default: false
      gpr-jitter:
        dtype: float
        default: 1e-8
        info: "Jitter term added to the diagonal of the covariance matrix in GPR to improve numerical stability. Default is 1e-8."
      gpr-tolerance:
        dtype: float
        default: 1e-4
        info: "Tolerance for the conjugate gradient solver in GPR. Default is 1e-4."
      gpr-patience:
        dtype: int
        default: 3
        info: "Patience for the conjugate gradient solver in GPR. Default is 3."
      gpr-maxiter:
        dtype: Optional[int]
        info: "Maximum iterations for the conjugate gradient solver in GPR. Default is None."
      gpr-samples:
        dtype: int
        default: 25
        info: "Number of samples to use for GPR variance estimate. Default is 25."


      

    outputs:
      output:
        info: "Output path. If does not exist, it will be created"
        dtype: Directory
        must_exist: false
