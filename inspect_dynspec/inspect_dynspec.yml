cabs:
  inspect_dynspec:
    info: Inspection tool for dynamic spectra produced by ms2dynspec.
    backend:
      select: native
    command: inspect-dynspec
    policies:
      prefix: "--"
    inputs:
      root:
        info: "Path to root folder of ms2dynspec output"
        dtype: Directory
        required: true
        policies:
          positional: true
      kernel:
        info: "Smoothing kernel FWHM size as tuples: (nu_delta (MHz), t_delta (s)) i.e. stimela run inspect_dynspec.yml kernel=[[2,3],[3,4]]"
        dtype: List[Tuple[float,float]]
        required: false
        default: [1,1]
        policies:
          repeat: repeat
          format: ({0[0]},{0[1]})
      nu-bounds:
        dtype: List[int]
        info: "Frequency range to consider in index units. Default: 0 -1"
        default : [0,-1]
        required: false
        policies:
          repeat: '[]'
      t-bounds:
        dtype: List[int]
        info: "Time range to consider in index units. Default: 0 -1"
        default : [0,-1]
        required: false
        policies:
          repeat: '[]'
      n-threads:
        dtype: int
        info: "Number of threads to use for FFT operations. Default 32."
        default: 32
        required: false
      stokes:
        dtype: str
        info: "Stokes parameter to consider. Provide string with any of I, Q, U, V. Eg: IV"
        default: "IQUV"
        required: false
      std-scale:
        dtype: float 
        info: "Plot saturates at std_scale * std(data) in plots"
        default: 2.0
        required: false
      debug:
        dtype: bool
        info: "Produce a plot of all terms for debugging purposes"
        default: false
      plot-for-paper:
        dtype: bool
        info: "Plot the data in a format suitable for publication"
        default: false
      zero-vcenter:
        dtype: bool
        info: "Set vcenter to zero instead of the mean of the data"
        default: false
      dpi:
        dtype: int
        info: "DPI of the output plots. Default 300."
        default: 300
        required: false
      calc-circular-pol:
        dtype: bool
        info: "Survey image to plot"
        default: false
      calc-linear-pol:
        dtype: bool
        info: "Calculate linear polarisation fraction sqrt((Q^2 + U^2) / I^2) after smoothing. Will also plot if --plot-smooth is set."
        default: false
      zero-sub-value-tolerance:
        dtype: float
        info: "Circular and linear polarization fractions require division by I. To avoid divide by zero issues, values within 0 ± tolerance are substituted for this tolerance value."
        required: false
        default: 1e-4
      cmap:
        dtype: str
        info: "Colormap to use for plotting. Default is inferno."
        required: false
        default: "inferno"
      verbose:
        dtype: bool
        info: "Enable verbose console output"
        default: false
      use-gpr:
        dtype: bool
        info: "Use Gaussian Process Regression (GPR) smoothing instead of standard convolution. If not specified, defaults to False and all gpr parameters are ignored."
        required: false
      gpr-jitter:
        dtype: float
        default: 1e-8
        info: "Jitter term added to the diagonal of the covariance matrix in GPR to improve numerical stability. Default is 1e-8."
        required: false
      gpr-tolerance:
        dtype: float
        default: 1e-4
        info: "Tolerance for the conjugate gradient solver in GPR. Default is 1e-4."
        required: false
      gpr-patience:
        dtype: int
        default: 3
        info: "Patience for the conjugate gradient solver in GPR. Default is 3."
        required: false
      gpr-maxiter:
        dtype: int
        info: "Maximum iterations for the conjugate gradient solver in GPR. Default is None."
        required: false
      gpr-samples:
        dtype: int
        default: 25
        info: "Number of samples to use for GPR variance estimate. Default is 25."
        required: false


      

    outputs:
      output:
        info: "Output path. If does not exist, it will be created"
        dtype: Directory
        required: true
        must_exist: false
